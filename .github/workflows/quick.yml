# The quick tier on every push and pull request (ADR 0073): install as the README says, ask the
# doctor, run the ~1,000 tests that take a minute. Linux is where every number was recorded and
# must pass; macOS and Windows are reported, not required - nothing had been run there when this
# was written, and their results are how we find out.
name: quick

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11', experimental: false}
          - {os: ubuntu-latest, python: '3.13', experimental: false}
          - {os: macos-latest, python: '3.13', experimental: true}
          - {os: windows-latest, python: '3.13', experimental: true}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: The system's OpenGL libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1
      - name: Install, as the README says
        run: python -m pip install -e ".[workshop,dev]"
      - name: little-world doctor
        run: python -m little_world doctor --no-window
      - name: The quick tier
        run: python -m pytest -q -m "not slow"
      - name: The five quick measurements, against the recorded numbers
        run: python -m little_world evidence --quick
