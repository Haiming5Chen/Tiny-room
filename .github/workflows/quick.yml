# The quick tier on every push and pull request (ADR 0073): install as the README says, ask the
# doctor, run the ~1,000 tests that take a minute and the quick measurements. Linux, macOS (Apple
# silicon) and Windows must all pass: Windows' first runs found three things that failed there on
# any machine, mended by 13 November (OPEN LW-045), and since ab83254 all four pass. A failed test
# is also written as an annotation the run's page shows to anyone (tests/conftest.py).
name: quick

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11', experimental: false}
          - {os: ubuntu-latest, python: '3.13', experimental: false}
          - {os: macos-latest, python: '3.13', experimental: false}
          - {os: windows-latest, python: '3.13', experimental: false}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: The system's OpenGL libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1
      - name: Install, as the README says
        run: python -m pip install -e ".[workshop,dev]"
      - name: little-world doctor
        run: python -m little_world doctor --no-window
      - name: The quick tier
        run: python -m pytest -q -m "not slow"
      - name: The six quick measurements, against the recorded numbers
        run: python -m little_world evidence --quick
