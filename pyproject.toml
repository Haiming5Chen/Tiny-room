[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "little-world"
version = "0.1.0"
description = "Compositional macroscopic world simulation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mujoco = ["mujoco==3.10.0"]
workshop = ["mujoco==3.10.0", "Pillow>=11,<13", "PyOpenGL>=3.1,<4"]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"little_world.assets" = ["data/*.rgb.gz", "data/lab_*.png", "data/SOURCES.json", "robots/*/*", "robots/*/assets/*", "samples/*"]
